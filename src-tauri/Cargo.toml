[package]
name = "calcritique"
version = "1.12.0"
description = "Calcritique : calculateur de dégâts pour Pokémon Champions"
authors = ["Meiynas"]
edition = "2021"

[lib]
name = "calcritique_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
