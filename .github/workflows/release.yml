# Fabrique le fichier d'installation Windows de Calcritique et le publie sur GitHub Releases.
# Se déclenche quand on pousse une étiquette de version, par exemple v0.1.0.
name: Publier une version (installeur Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Appelé par la mise à jour automatique des données (data-refresh.yml) avec l'étiquette à publier
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Calcritique ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Téléchargez le fichier .exe ci-dessous pour installer ou mettre à jour Calcritique."
          releaseDraft: false
          prerelease: false
